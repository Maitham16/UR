version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 10
    groups:
      compatible-dependency-updates:
        update-types:
          - minor
          - patch
        # These packages have shipped API/type breaks in nominally compatible
        # updates. Keep them out of broad batches until their migrations are
        # deliberately implemented and reviewed together.
        exclude-patterns:
          - "@alcalzone/ansi-tokenize"
          - "@types/react"
          - "@types/react-reconciler"
    ignore:
      - dependency-name: "@alcalzone/ansi-tokenize"
        versions: [">=0.2.0"]
      - dependency-name: "@types/react"
        versions: [">=19.0.0"]
      - dependency-name: "@types/react-reconciler"
        versions: [">=0.29.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /extensions/vscode-ur-inline-diffs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    groups:
      vscode-compatible-dependency-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /extensions/jetbrains-ur
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    groups:
      jetbrains-compatible-dependency-updates:
        update-types:
          - minor
          - patch
