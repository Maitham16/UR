name: Native release artifacts

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install frozen dependencies
        id: dependencies
        run: bun ci
      - name: Test native installation and executable routing
        run: bun test --timeout 120000 test/nativeRelease.test.ts test/nativeInstallationDiagnostics.test.ts test/urExecutable.test.ts test/npmNativeInstallation.test.ts test/homebrewInstallation.test.ts
      - name: Build bundled VS Code integration
        id: ide
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: extensions/vscode-ur-inline-diffs
        run: |
          npm ci
          npm run build
      - name: Compile native application and resources
        id: compile
        if: ${{ !cancelled() && steps.ide.outcome == 'success' }}
        run: node scripts/native-build.mjs --target ${{ matrix.target }} --out-dir dist-native
      - name: Sign native application when publisher identities are configured
        id: sign
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: node scripts/native-sign.mjs --target ${{ matrix.target }}
      - name: Archive native application
        id: archive
        if: ${{ !cancelled() && steps.sign.outcome == 'success' }}
        run: node scripts/native-release.mjs --target ${{ matrix.target }}
      - name: Test shipped archive without JavaScript runtime on PATH
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        run: node scripts/native-smoke.mjs --target ${{ matrix.target }} --artifact-dir dist-release/native
      - name: Test npm installation without Bun or lifecycle scripts
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        run: node scripts/npm-native-smoke.mjs --target ${{ matrix.target }} --artifact-dir dist-release/native
      - name: Preserve native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-failure-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ur native release smoke */*.log
            ${{ runner.temp }}/ur native release smoke */*.json
            ${{ runner.temp }}/ur native release smoke */*.jsonl
            ${{ runner.temp }}/ur bootstrap */*.json
            ${{ runner.temp }}/ur npm native smoke */*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Attest tested native archive
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/native/ur-*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.target }}
          path: dist-release/native/*
          if-no-files-found: error
          retention-days: 14
