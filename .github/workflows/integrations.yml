name: SDK and editor distributions

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 24
      - name: Install and verify SDKs
        run: |
          set -euo pipefail
          bun ci
          node scripts/build-sdk.mjs
          bun test test/sdkTransport.test.ts test/sdkRemoteIntegration.test.ts test/sdkScaffold.test.ts --timeout 120000
          mkdir -p integration-assets
          python3 -m venv "$RUNNER_TEMP/ur-python-sdk"
          "$RUNNER_TEMP/ur-python-sdk/bin/python" -m pip install build
          "$RUNNER_TEMP/ur-python-sdk/bin/python" -m build sdk-python --outdir integration-assets
          "$RUNNER_TEMP/ur-python-sdk/bin/python" -m pip install --no-deps integration-assets/*.whl
          "$RUNNER_TEMP/ur-python-sdk/bin/python" scripts/python-sdk-smoke.py
      - name: Build and package VS Code extension
        working-directory: extensions/vscode-ur-inline-diffs
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          bun test src --timeout 120000
          version=$(node -p 'require("./package.json").version')
          npm run package -- --out "../../integration-assets/ur-inline-diffs-${version}.vsix"
      - name: Test packaged VSIX in a real editor host
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libgtk-3-0t64 libnss3 libgbm1
          mkdir -p "$RUNNER_TEMP/ur-vscode"
          curl --fail --location --retry 3 'https://update.code.visualstudio.com/1.139.1/linux-x64/stable' -o "$RUNNER_TEMP/ur-vscode.tar.gz"
          printf '%s  %s\n' '0c9cbcea070e9a0fc62de5c78fee01a80f8e32f78ada664d9731f6c517503b7e' "$RUNNER_TEMP/ur-vscode.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ur-vscode.tar.gz" -C "$RUNNER_TEMP/ur-vscode" --strip-components=1
          # Tar extraction as runner cannot preserve the root-owned SUID helper.
          # Keep Chromium sandboxing enabled on Ubuntu's restricted user namespaces.
          sudo chown root:root "$RUNNER_TEMP/ur-vscode/chrome-sandbox"
          sudo chmod 4755 "$RUNNER_TEMP/ur-vscode/chrome-sandbox"
          version=$(node -p 'require("./package.json").version')
          xvfb-run -a node scripts/editor-host-smoke.mjs --code "$RUNNER_TEMP/ur-vscode/code" --vsix "integration-assets/ur-inline-diffs-${version}.vsix"
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.4.0'
      - name: Build and validate JetBrains distribution
        working-directory: extensions/jetbrains-ur
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1g buildPlugin verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin
          cp build/distributions/*.zip ../../integration-assets/
      - name: Upload verified SDK and editor packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-distributions
          path: integration-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Retain editor host failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-host-evidence
          path: |
            /tmp/ur-editor-host-*/result.json
            /tmp/ur-editor-host-*/host.log
            /tmp/ur-editor-host-*/user/logs/**
            /tmp/ur-editor-host-*/workspace/cli-trace.jsonl
          if-no-files-found: ignore
          retention-days: 7
