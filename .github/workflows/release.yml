name: Release

# Turns a pushed tag into a production release: verify, publish a GitHub
# Release with notes from CHANGELOG.md, then publish the verified tarball to
# npm. Nothing here trusts the tag alone — the version it encodes must match
# package.json, and the artifact that ships is the one that passed the gate.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.50.5
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      already-on-npm: ${{ steps.resolve.outputs.already-on-npm }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve and guard version
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          version="$(node -p "require('./package.json').version")"
          # A tag that disagrees with package.json would ship a build whose
          # embedded version, changelog entry, and registry entry disagree.
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version" >&2
            exit 1
          fi
          if ! grep -q "^## ${version}\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' section" >&2
            exit 1
          fi
          published=false
          if npm view "ur-agent@${version}" version >/dev/null 2>&1; then
            published=true
          fi
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'already-on-npm=%s\n' "$published"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun ci

      - name: Full release gate
        run: |
          set -euo pipefail
          bun run typecheck
          bun run lint
          bun test --timeout 120000
          bun run build
          bun run release:check

      - name: Smoke test the built CLI
        run: |
          set -euo pipefail
          node ./bin/ur.js --version
          node ./bin/ur.js --help > /dev/null

      - name: Pack the tarball that will ship
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # --ignore-scripts: prepack already ran as part of release:check above.
          npm pack --ignore-scripts --pack-destination dist-release
          ls -l dist-release

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ur-agent-${{ steps.resolve.outputs.version }}
          path: dist-release/*.tgz
          if-no-files-found: error
          retention-days: 14

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Download verified tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          gh run download "$GITHUB_RUN_ID" \
            --name "ur-agent-${{ needs.verify.outputs.version }}" \
            --dir dist-release

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Notes are the changelog section for this version, so the release
          # page and the repository never drift apart.
          awk -v v="## $VERSION" '
            $0 == v { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s\n' "$VERSION" > release-notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "UR-Nexus $VERSION" \
              --notes-file release-notes.md
            gh release upload "$TAG" dist-release/*.tgz --clobber
          else
            gh release create "$TAG" \
              --title "UR-Nexus $VERSION" \
              --notes-file release-notes.md \
              --verify-tag \
              dist-release/*.tgz
          fi

  npm-publish:
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download verified tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          gh run download "$GITHUB_RUN_ID" \
            --name "ur-agent-${{ needs.verify.outputs.version }}" \
            --dir dist-release

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          ALREADY_PUBLISHED: ${{ needs.verify.outputs.already-on-npm }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm publish. \
          Add the secret to publish automatically."
            exit 0
          fi
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            echo "::notice::ur-agent@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          # Publish the exact artifact the gate verified, not a fresh pack.
          npm publish dist-release/ur-agent-"$VERSION".tgz --access public
