name: Release

# Turns a pushed tag into a production release: verify the tag and artifact,
# publish the verified native downloads, then publish the native npm launcher
# with OIDC. Nothing here trusts the tag alone — its version must match
# package.json, and the artifact that ships is the one that passed the gate.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.50.5
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  integrations:
    needs: verify
    uses: ./.github/workflows/integrations.yml
    with:
      ref: ${{ needs.verify.outputs.tag }}
  native:
    needs: verify
    uses: ./.github/workflows/native.yml
    with:
      ref: ${{ needs.verify.outputs.tag }}
    secrets: inherit
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      already-on-npm: ${{ steps.resolve.outputs.already-on-npm }}
      npm-tag: ${{ steps.resolve.outputs.npm-tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve and guard version
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          version="$(node -p "require('./package.json').version")"
          # A tag that disagrees with package.json would ship a build whose
          # embedded version, changelog entry, and registry entry disagree.
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version" >&2
            echo "::error::Commit and push the complete version bump before tagging. Use 'bun run release:tag' for preflight, then 'bun run release:tag -- --push'. Never move an existing release tag." >&2
            exit 1
          fi
          if ! grep -q "^## ${version}\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${version}' section" >&2
            exit 1
          fi
          published=false
          if npm view "ur-agent@${version}" version >/dev/null 2>&1; then
            published=true
          fi
          prerelease=false
          npm_tag=latest
          if [[ "$version" == *-* ]]; then
            prerelease=true
            # Never let a prerelease replace the stable release behind
            # `npm install ur-agent`. All prereleases advance `next`.
            npm_tag=next
          fi
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'already-on-npm=%s\n' "$published"
            printf 'npm-tag=%s\n' "$npm_tag"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun ci

      - name: Install browser and Python fixtures
        run: |
          bunx --no-install playwright-core install --with-deps chromium
          sudo apt-get install -y python3-venv

      - name: Full release gate
        env:
          UR_REQUIRE_BROWSER_QA_TESTS: '1'
          UR_REQUIRE_FULL_BENCHMARK_FIXTURES: '1'
        run: |
          set -euo pipefail
          bun run typecheck
          bun run lint
          bun run secrets:scan
          # Bun's parallel workers can collide on server.listen(0), producing
          # EADDRINUSE in tests that correctly request an ephemeral port.
          bun test --timeout 120000
          bun run build
          bun run release:check

      # Grades every recorded eval trajectory, not just its final answer. The
      # score is deterministic, so this can gate a release: a run that edited
      # files without verifying, issued a destructive command, or looped on an
      # identical failure fails here even when its conclusion was correct.
      # Skipped rather than failed when no trajectories are recorded, so the
      # gate never blocks on an empty fixture set.
      - name: Grade recorded trajectories
        run: |
          set -euo pipefail
          shopt -s nullglob
          transcripts=(.ur/eval/trajectories/*.jsonl)
          if [ ${#transcripts[@]} -eq 0 ]; then
            echo "No recorded trajectories; nothing to grade."
            exit 0
          fi
          mkdir -p dist-release
          scores=dist-release/trajectory-scores.json
          printf '{"version":"%s","graded":[' "${{ steps.resolve.outputs.version }}" > "$scores"
          first=1
          status=0
          for transcript in "${transcripts[@]}"; do
            echo "::group::$transcript"
            if ! node ./bin/ur.js grade-trajectory --file "$transcript" --min-score "${UR_TRAJECTORY_MIN_SCORE:-70}"; then
              status=1
            fi
            [ $first -eq 1 ] || printf ',' >> "$scores"
            first=0
            printf '{"transcript":"%s","grade":' "$transcript" >> "$scores"
            node ./bin/ur.js grade-trajectory --file "$transcript" --json >> "$scores"
            printf '}' >> "$scores"
            echo "::endgroup::"
          done
          printf ']}' >> "$scores"
          echo "Wrote versioned category scores to $scores"
          exit $status

      - name: Smoke test the built CLI
        run: |
          set -euo pipefail
          node ./bin/ur.js --version
          node ./bin/ur.js --help > /dev/null

      - name: Pack the verified source bundle for native npm assembly
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # --ignore-scripts: prepack already ran as part of release:check above.
          npm pack --ignore-scripts --pack-destination dist-release
          ls -l dist-release

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ur-agent-source-${{ steps.resolve.outputs.version }}
          path: dist-release/*.tgz
          if-no-files-found: error
          retention-days: 14

  prepare-npm:
    needs: [verify, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - name: Assemble the dependency-free npm package from tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist-release/source dist-release/native dist-release/npm
          gh run download "$GITHUB_RUN_ID" --name "ur-agent-source-$VERSION" --dir dist-release/source
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            gh run download "$GITHUB_RUN_ID" --name "native-$target" --dir dist-release/native
          done
          node scripts/native-manifest.mjs dist-release/native
          node scripts/npm-native-package.mjs --source-tarball "dist-release/source/ur-agent-$VERSION.tgz" --manifest dist-release/native/manifest.json --out-dir dist-release/npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ur-agent-${{ needs.verify.outputs.version }}
          path: dist-release/npm/*.tgz
          if-no-files-found: error
          retention-days: 14

  github-release:
    # npm's first invocation downloads its pinned native archive. Make all
    # verified public assets available before npm can expose that launcher.
    needs: [verify, native, prepare-npm, integrations]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Download verified tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          gh run download "$GITHUB_RUN_ID" \
            --name "ur-agent-${{ needs.verify.outputs.version }}" \
            --dir dist-release

      - name: Download and merge tested native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist-release/native
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            gh run download "$GITHUB_RUN_ID" --name "native-$target" --dir dist-release/native
          done
          node scripts/native-manifest.mjs dist-release/native

      - name: Download verified SDK and editor distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist-release/integrations
          gh run download "$GITHUB_RUN_ID" --name integration-distributions --dir dist-release/integrations

      - name: Attest the public native manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/native/manifest.json
            dist-release/native/SHA256SUMS
            dist-release/integrations/*

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Notes are the changelog section for this version, so the release
          # page and the repository never drift apart.
          awk -v v="## $VERSION" '
            $0 == v { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s\n' "$VERSION" > release-notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "UR-Nexus $VERSION" \
              --prerelease="$PRERELEASE" \
              --notes-file release-notes.md
            gh release upload "$TAG" dist-release/*.tgz dist-release/native/ur-*.tar.gz dist-release/native/manifest.json dist-release/native/SHA256SUMS dist-release/integrations/* install.sh uninstall.sh --clobber
          else
            gh release create "$TAG" \
              --title "UR-Nexus $VERSION" \
              --prerelease="$PRERELEASE" \
              --notes-file release-notes.md \
              --verify-tag \
              dist-release/*.tgz dist-release/native/ur-*.tar.gz dist-release/native/manifest.json dist-release/native/SHA256SUMS dist-release/integrations/* install.sh uninstall.sh
          fi

  npm-publish:
    needs: [verify, prepare-npm, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      # npm exchanges GitHub's short-lived OIDC identity for publish access.
      # This avoids long-lived tokens and interactive 2FA/OTP failures.
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download verified tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          gh run download "$GITHUB_RUN_ID" \
            --name "ur-agent-${{ needs.verify.outputs.version }}" \
            --dir dist-release

      - name: Publish to npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ALREADY_PUBLISHED: ${{ needs.verify.outputs.already-on-npm }}
          NPM_TAG: ${{ needs.verify.outputs.npm-tag }}
        run: |
          set -euo pipefail
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            echo "::notice::ur-agent@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC is unavailable; npm trusted publishing requires id-token: write." >&2
            exit 1
          fi
          # Publish the exact artifact the gate verified, not a fresh pack.
          # The leading ./ is required. Without it, npm treats the
          # slash-containing value as GitHub shorthand and attempts an SSH
          # clone instead of publishing the downloaded local tarball.
          npm publish ./dist-release/ur-agent-"$VERSION".tgz \
            --access public \
            --tag "$NPM_TAG"
