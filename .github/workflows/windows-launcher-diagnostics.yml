name: Windows launcher diagnostics

on:
  push:
    branches: [ur-windows-launcher-diagnostics]

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Capture exact launcher behavior (diagnostic only)
        shell: pwsh
        run: |
          $env:UR_DIAG_BUN = (Get-Command bun).Source
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\windows-launcher-diagnostics.ps1
          exit $LASTEXITCODE
      - name: Upload diagnostic capture (not release qualification)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-launcher-diagnostics-${{ github.run_id }}
          path: artifacts/windows-launcher-diagnostics/*
          if-no-files-found: error
          retention-days: 7
