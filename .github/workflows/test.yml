name: Test Production

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 24

      - name: Environment info
        run: |
          set -x
          uname -a
          bun --version
          node --version
          npm --version
          git --version
          which git node npm bun ollama docker gh || true

      - name: Install dependencies (Bun)
        run: |
          set -xeuo pipefail
          bun ci

      - name: Dependency audit
        run: |
          set -xeuo pipefail
          bun run dependencies:audit

      - name: Typecheck
        run: |
          set -xeuo pipefail
          bun run typecheck

      - name: Lint
        run: |
          set -xeuo pipefail
          bun run lint

      - name: Install browser for real QA integration tests
        run: |
          bunx --no-install playwright-core install --with-deps chromium
          sudo apt-get install -y python3-venv

      - name: Run tests (Bun)
        env:
          UR_REQUIRE_BROWSER_QA_TESTS: '1'
          UR_REQUIRE_FULL_BENCHMARK_FIXTURES: '1'
        run: |
          set -xeuo pipefail
          # Bun's parallel workers can collide on server.listen(0), producing
          # EADDRINUSE in tests that correctly request an ephemeral port.
          bun test --timeout 120000 2>&1 | tee test-output.log

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-output.log
            bun.lock
          retention-days: 7

      - name: Build bundle
        if: success()
        run: |
          set -xeuo pipefail
          bun run bundle

      - name: Smoke test
        if: success()
        run: |
          set -xeuo pipefail
          bun run smoke

      - name: Secret scan
        if: success()
        run: |
          set -xeuo pipefail
          bun run secrets:scan

      - name: Release check
        if: success()
        run: |
          set -xeuo pipefail
          bun run release:check

      - name: Package Check
        if: success()
        run: |
          set -xeuo pipefail
          bun run package:check

      # Source installation remains a developer path. The native matrix above
      # tests the actual public npm package with Bun absent and scripts disabled.
      - name: Test developer source global installation
        if: success()
        run: |
          set -xeuo pipefail
          npm install -g .
          ur --version

  ide-extensions:
    uses: ./.github/workflows/integrations.yml
    permissions:
      contents: read
